<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<title>Paper Crowd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Layout: the stream is the hero; a DJ tablet sits under it and a viewer's phone sits beside it. Single look: construction paper in a club. */
:root{
  color-scheme:dark;
  --night:#17114f; --panel:#271c82; --panel-2:#35289f; --paper:#fffdf6; --ink:#1a1358;
  --pink:#ff3d81; --gold:#ffc21a; --teal:#19d3c5; --soft:#cfcaff;
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{background:var(--night);color:var(--paper)}
body{font-family:var(--body);font-weight:500;line-height:1.4;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1480px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font:400 clamp(26px,3.4vw,40px)/1 var(--display);margin:0;color:var(--gold);letter-spacing:.01em}
header p{margin:0;color:var(--soft);min-width:0;font-size:15px}
.show{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.left{display:grid;gap:18px;min-width:0}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:#150f4f;border:6px solid var(--paper);border-radius:6px;box-shadow:8px 8px 0 var(--pink);overflow:hidden}
canvas#c{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
canvas#c:active{cursor:grabbing}
.tablet,.phone{background:var(--panel);border-radius:6px;padding:16px;min-width:0}
.tablet{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px 22px}
.group{display:grid;gap:9px;align-content:start;min-width:0}
h2{font:400 15px/1.1 var(--display);margin:0;letter-spacing:.05em;text-transform:uppercase;color:var(--teal)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:800 14px/1 var(--body);color:var(--ink);background:var(--paper);border:0;border-radius:5px;padding:11px 13px;cursor:pointer;box-shadow:0 4px 0 #0e0a3a;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0e0a3a}
.btn[aria-pressed="true"]{background:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.pick:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn.big{font:400 22px/1 var(--display);padding:15px 20px;background:var(--pink);color:var(--paper);flex:1 1 auto}
#c{background:#0f0845}
.btn.tap{flex:1 1 auto;padding:15px;background:var(--gold);font-size:16px}
.btn.wide{width:100%}
.read{font:400 26px/1 var(--display);font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.read small{display:block;font:700 11px/1.3 var(--body);color:var(--soft);letter-spacing:.06em}
label.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-weight:700;font-size:13.5px;color:var(--soft)}
label.sl output{color:var(--paper);font-variant-numeric:tabular-nums}
label.sl input{grid-column:1/-1;width:100%;accent-color:var(--pink);margin:2px 0}
.hint{font-size:12.5px;color:var(--soft);margin:0}
@media (min-width:1100px){.group.wide{grid-column:span 2}}
.phone{display:grid;gap:11px}
.phone h2{margin-bottom:-3px}
#pv{display:block;width:100%;height:190px;background:var(--panel-2);border-radius:5px}
.grid-picks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.grid-picks.hats{grid-template-columns:repeat(5,minmax(0,1fr))}
#heads{grid-template-columns:repeat(4,minmax(0,1fr))}
.pick{padding:0;border:0;background:var(--panel-2);border-radius:5px;cursor:pointer;aspect-ratio:1;min-width:0;overflow:hidden}
.pick canvas{display:block;width:100%;height:100%}
.pick[aria-pressed="true"]{background:var(--gold)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--paper);padding:0;cursor:pointer}
.sw[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.field{display:grid;gap:4px;font-weight:700;font-size:13.5px;color:var(--soft)}
.field input{font:700 15px var(--body);padding:10px;border-radius:5px;border:0;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.emotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.emotes .btn{padding:12px 4px;font-size:13.5px}
.emotes .btn:first-child{grid-column:auto}
@media (max-width:980px){.show{grid-template-columns:minmax(0,1fr)}.stage{box-shadow:5px 5px 0 var(--pink)}}
</style>

<div class="wrap">
  <header>
    <h1>Paper Crowd</h1>
    <p>Concept test. Every Bibo here is a fake viewer, and the art is placeholder.</p>
  </header>
  <div class="show">
    <div class="left">
      <div class="stage"><canvas id="c" aria-label="A crowd of Bibos bouncing at a paper festival stage. Drag to pan, scroll to zoom."></canvas></div>
      <section class="tablet" aria-label="DJ tablet">
        <div class="group">
          <h2>Tempo</h2>
          <div class="row">
            <button class="btn tap" id="tap">Tap tempo</button>
            <div class="read"><span id="bpm">128</span><small>BPM</small></div>
          </div>
          <div class="row">
            <button class="btn" id="nudgeL" aria-label="Nudge beat earlier">Nudge &minus;</button>
            <button class="btn" id="nudgeR" aria-label="Nudge beat later">Nudge +</button>
            <button class="btn" id="snd" aria-pressed="false">Test beat</button>
          </div>
        </div>
        <div class="group">
          <h2>Moments</h2>
          <div class="row">
            <button class="btn big" id="drop">Drop</button>
            <button class="btn" id="lights" aria-pressed="false" style="padding-block:17px">Lights down</button>
          </div>
          <label class="sl" for="energy">Music volume <output id="energyO">65%</output>
            <input id="energy" type="range" min="0" max="100" value="65"></label>
        </div>
        <div class="group">
          <h2>Chat (simulated)</h2>
          <label class="sl" for="chat">Chat speed <output id="chatO">35%</output>
            <input id="chat" type="range" min="0" max="100" value="35"></label>
          <div class="grid-picks" id="spam" role="group" aria-label="Make chat spam one emote"></div>
          <div class="row"><button class="btn" id="fill">Fill the meter</button><p class="hint" style="flex:1 1 120px">Tap an emote to make chat spam it.</p></div>
        </div>
        <div class="group wide">
          <h2>Camera</h2>
          <div class="row" id="shots"></div>
          <label class="sl" for="zoom">Zoom <output id="zoomO">1.0x</output>
            <input id="zoom" type="range" min="70" max="240" value="100"></label>
          <h2 style="margin-top:4px">Lights</h2>
          <div class="row" id="looks"></div>
        </div>
        <div class="group">
          <h2>Crowd</h2>
          <label class="sl" for="size">Stress test <output id="sizeO">140</output>
            <input id="size" type="range" min="30" max="500" step="10" value="140"></label>
          <div class="row" id="everyone"></div>
          <p class="hint"><span id="fps">--</span> fps. Drag the stream to pan, scroll to zoom.</p>
        </div>
      </section>
    </div>

    <aside class="phone" aria-label="Viewer's phone">
      <h2>Build your Bibo</h2>
      <canvas id="pv" aria-label="Preview of your Bibo"></canvas>
      <div class="grid-picks" id="heads" role="group" aria-label="Head"></div>
      <div class="grid-picks hats" id="hats" role="group" aria-label="Hat"></div>
      <div class="grid-picks" id="extras" role="group" aria-label="Extras"></div>
      <div class="swatches" id="colors" role="group" aria-label="Body color"></div>
      <div class="swatches" id="shirts" role="group" aria-label="Shirt color"></div>
      <label class="field" for="name">Twitch name (comes from login)
        <input id="name" value="your_twitch_name" maxlength="25" autocomplete="off" spellcheck="false"></label>
      <button class="btn big wide" id="join">Send in your Bibo</button>
      <div class="emotes" id="emotes"></div>
      <div class="field">Send an emote over your head
        <div class="grid-picks" id="float" role="group" aria-label="Send an emote"></div></div>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';
const PI=Math.PI,TAU=PI*2,PAPER='#fffdf6',INK='#1a1358';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry(7);
const pick=a=>a[Math.floor(rnd()*a.length)];
const range=(a,b)=>a+rnd()*(b-a);

const COLORS=['#2fd16b','#ff7a2f','#ff5fa8','#35c8ff','#b983ff','#ffd23f','#ef4545','#23c9a9'];
const SHIRTS=['#ff3d81','#2b7bff','#ffc21a','#ffffff','#14b8a6','#7c3aed'];
const PATTERNS=['plain','stripe','bolt'];
const NAMECOL=['#d81b60','#1d4ed8','#047857','#7c3aed','#c2410c','#0e7490'];
const HEADNAMES=['cat','dog','frog','moth','cactus','ghost','toaster','gremlin'];
const HATNAMES=['none','flowers','bow','party','bucket','crown','phones','mohawk','swoop','horns'];
const EXTRANAMES=['none','hearts','kandi','shades','paint','spikes'];
const HEADTOP={cat:-.38,dog:-.42,frog:-.5,moth:-.42,cactus:-.5,ghost:-.48,toaster:-.32,gremlin:-.38};
const EYEY={cat:-.03,dog:-.1,frog:-.36,moth:-.06,cactus:-.1,ghost:-.08,toaster:-.04,gremlin:-.05};
const EYEX={cat:.21,dog:.19,frog:.28,moth:.2,cactus:.14,ghost:.17,toaster:.2,gremlin:.2};

/* ---------- paper pieces ---------- */
function cut(g,path,fill,edge){
  g.beginPath();path(g);g.lineJoin='round';g.lineCap='round';
  g.strokeStyle=PAPER;g.lineWidth=edge||.09;g.stroke();
  g.fillStyle=fill;g.fill();
}
const circ=(x,y,r)=>g=>{g.moveTo(x+r,y);g.arc(x,y,r,0,TAU)};
const ell=(x,y,a,b)=>g=>{g.moveTo(x+a,y);g.ellipse(x,y,a,b,0,0,TAU)};
const rr=(x,y,w,h,r)=>g=>g.roundRect(x,y,w,h,r);
function fill(g,path,c){g.beginPath();path(g);g.fillStyle=c;g.fill()}
function line(g,c,w,draw){g.beginPath();draw(g);g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.stroke()}
function eyes(g,dx,y,r){
  fill(g,circ(-dx,y,r),'#fff');fill(g,circ(dx,y,r),'#fff');
  fill(g,circ(-dx+r*.2,y+r*.1,r*.55),INK);fill(g,circ(dx-r*.2,y+r*.1,r*.55),INK);
}
const HEADS={
  frog(g,c,b){
    cut(g,circ(-.28,-.34,.19),c);cut(g,circ(.28,-.34,.19),c);cut(g,ell(0,.03,.58,.42),c);
    fill(g,circ(-.28,-.34,.16),c);fill(g,circ(.28,-.34,.16),c);
    if(b)return;
    eyes(g,.28,-.36,.13);
    line(g,INK,.05,x=>{x.moveTo(-.36,.08);x.quadraticCurveTo(0,.36,.36,.08)});
    fill(g,ell(-.42,.1,.08,.05),'#ff9ec4');fill(g,ell(.42,.1,.08,.05),'#ff9ec4');
  },
  moth(g,c,b){
    line(g,INK,.04,x=>{x.moveTo(-.12,-.36);x.quadraticCurveTo(-.3,-.75,-.55,-.72);x.moveTo(.12,-.36);x.quadraticCurveTo(.3,-.75,.55,-.72);
      for(let i=0;i<4;i++){const t=.45+i*.17;x.moveTo(-.2-t*.45,-.5-t*.3);x.lineTo(-.25-t*.45,-.66-t*.3);x.moveTo(.2+t*.45,-.5-t*.3);x.lineTo(.25+t*.45,-.66-t*.3)}});
    cut(g,ell(0,.32,.52,.2),'#fff6d8');
    cut(g,circ(0,-.02,.43),c);
    if(b)return;
    fill(g,ell(-.2,-.05,.15,.19),INK);fill(g,ell(.2,-.05,.15,.19),INK);
    fill(g,circ(-.15,-.12,.05),'#fff');fill(g,circ(.25,-.12,.05),'#fff');
    line(g,INK,.04,x=>{x.moveTo(-.07,.22);x.quadraticCurveTo(0,.28,.07,.22)});
  },
  cactus(g,c,b){
    line(g,PAPER,.3,x=>{x.moveTo(-.28,.14);x.lineTo(-.56,.14);x.lineTo(-.56,-.18);x.moveTo(.28,.02);x.lineTo(.56,.02);x.lineTo(.56,-.3)});
    line(g,c,.21,x=>{x.moveTo(-.28,.14);x.lineTo(-.56,.14);x.lineTo(-.56,-.18);x.moveTo(.28,.02);x.lineTo(.56,.02);x.lineTo(.56,-.3)});
    cut(g,rr(-.33,-.5,.66,1.02,.33),c);
    line(g,'rgba(255,255,255,.55)',.03,x=>{for(const[a,e]of[[-.2,-.28],[.2,-.3],[-.22,.32],[.22,.34],[0,.42],[0,-.4]]){x.moveTo(a-.04,e);x.lineTo(a+.04,e)}});
    if(b)return;
    eyes(g,.14,-.1,.1);
    line(g,INK,.045,x=>{x.moveTo(-.1,.12);x.quadraticCurveTo(0,.22,.1,.12)});
  },
  ghost(g,c,b){
    const s=x=>{x.moveTo(-.46,.46);x.lineTo(-.46,-.04);x.arc(0,-.04,.46,PI,0);x.lineTo(.46,.46);
      x.quadraticCurveTo(.345,.3,.23,.46);x.quadraticCurveTo(.115,.3,0,.46);x.quadraticCurveTo(-.115,.3,-.23,.46);x.quadraticCurveTo(-.345,.3,-.46,.46);x.closePath()};
    cut(g,s,c);
    if(b)return;
    fill(g,ell(-.17,-.08,.09,.14),INK);fill(g,ell(.17,-.08,.09,.14),INK);
    fill(g,ell(0,.14,.07,.09),INK);
    fill(g,ell(-.32,.08,.08,.05),'rgba(255,255,255,.65)');fill(g,ell(.32,.08,.08,.05),'rgba(255,255,255,.65)');
  },
  toaster(g,c,b){
    cut(g,rr(-.3,-.54,.26,.4,.07),'#f0b76a');cut(g,rr(.04,-.48,.26,.34,.07),'#f0b76a');
    cut(g,rr(-.54,-.26,1.08,.72,.17),c);
    fill(g,rr(-.54,.2,1.08,.08,0),'rgba(255,255,255,.5)');
    cut(g,rr(.54,-.1,.1,.26,.04),INK,.05);
    if(b)return;
    eyes(g,.2,-.04,.12);
    line(g,INK,.05,x=>{x.moveTo(-.12,.13);x.lineTo(.12,.13)});
  },
  gremlin(g,c,b){
    const e=s=>x=>{x.moveTo(s*.32,-.24);x.lineTo(s*.93,-.48);x.lineTo(s*.4,.14);x.closePath()};
    cut(g,e(-1),c);cut(g,e(1),c);
    fill(g,x=>{x.moveTo(-.42,-.16);x.lineTo(-.76,-.36);x.lineTo(-.44,.04);x.closePath();x.moveTo(.42,-.16);x.lineTo(.76,-.36);x.lineTo(.44,.04);x.closePath()},'rgba(255,255,255,.4)');
    cut(g,ell(0,.02,.48,.4),c);
    if(b)return;
    fill(g,ell(-.2,-.05,.13,.1),'#ffe66b');fill(g,ell(.2,-.05,.13,.1),'#ffe66b');
    fill(g,ell(-.2,-.05,.035,.09),INK);fill(g,ell(.2,-.05,.035,.09),INK);
    line(g,INK,.04,x=>{x.moveTo(-.2,.2);x.quadraticCurveTo(0,.27,.2,.2)});
    fill(g,x=>{x.moveTo(.06,.23);x.lineTo(.17,.2);x.lineTo(.12,.33);x.closePath()},'#fff');
  }
};
const HATS={
  none(){},
  party(g){
    cut(g,x=>{x.moveTo(-.25,.08);x.lineTo(0,-.62);x.lineTo(.25,.08);x.closePath()},'#ff3d81');
    fill(g,x=>{x.moveTo(-.16,-.17);x.lineTo(.16,-.17);x.lineTo(.08,-.38);x.lineTo(-.08,-.38);x.closePath()},'#ffc21a');
    cut(g,circ(0,-.64,.09),'#19d3c5');
  },
  bucket(g){
    cut(g,x=>{x.moveTo(-.54,.12);x.lineTo(-.3,-.32);x.lineTo(.3,-.32);x.lineTo(.54,.12);x.closePath()},'#ffc21a');
    fill(g,rr(-.4,-.14,.8,.1,0),'#ff3d81');
  },
  crown(g){cut(g,x=>{x.moveTo(-.34,.1);x.lineTo(-.4,-.34);x.lineTo(-.18,-.1);x.lineTo(0,-.44);x.lineTo(.18,-.1);x.lineTo(.4,-.34);x.lineTo(.34,.1);x.closePath()},'#ffc21a');fill(g,circ(0,-.08,.06),'#ff3d81')},
  phones(g){
    line(g,PAPER,.17,x=>{x.moveTo(-.5,.42);x.quadraticCurveTo(-.5,-.28,0,-.28);x.quadraticCurveTo(.5,-.28,.5,.42)});
    line(g,INK,.1,x=>{x.moveTo(-.5,.42);x.quadraticCurveTo(-.5,-.28,0,-.28);x.quadraticCurveTo(.5,-.28,.5,.42)});
    cut(g,rr(-.66,.26,.24,.44,.1),'#ff3d81');cut(g,rr(.42,.26,.24,.44,.1),'#ff3d81');
  },
  mohawk(g){cut(g,x=>{x.moveTo(-.34,.12);for(let i=0;i<5;i++){const a=-.34+.17*i;x.lineTo(a+.05,-.48+Math.abs(i-2)*.09);x.lineTo(a+.17,.02)}x.lineTo(.34,.12);x.closePath()},'#ff2f6b')},
  swoop(g,b){
    if(b){cut(g,rr(-.42,-.12,.84,.6,.3),'#241a5e');return}
    cut(g,x=>{x.moveTo(.42,.2);x.quadraticCurveTo(.46,-.2,.05,-.2);x.quadraticCurveTo(-.46,-.16,-.46,.56);x.quadraticCurveTo(-.26,.45,-.16,.38);x.quadraticCurveTo(.15,.14,.42,.2);x.closePath()},'#241a5e');
  }
};
HEADS.cat=function(g,c,b){
  const ear=s=>x=>{x.moveTo(s*.44,-.1);x.lineTo(s*.47,-.62);x.lineTo(s*.08,-.32);x.closePath()};
  cut(g,ear(-1),c);cut(g,ear(1),c);
  fill(g,x=>{for(const s of[-1,1]){x.moveTo(s*.38,-.2);x.lineTo(s*.41,-.48);x.lineTo(s*.18,-.31);x.closePath()}},'#ffb3cf');
  cut(g,ell(0,.03,.5,.42),c);
  line(g,'rgba(255,255,255,.6)',.05,x=>{x.moveTo(0,-.36);x.lineTo(0,-.2);x.moveTo(-.14,-.33);x.lineTo(-.12,-.2);x.moveTo(.14,-.33);x.lineTo(.12,-.2)});
  if(b)return;
  fill(g,ell(-.21,-.03,.12,.13),'#fff');fill(g,ell(.21,-.03,.12,.13),'#fff');
  fill(g,ell(-.21,-.03,.05,.11),INK);fill(g,ell(.21,-.03,.05,.11),INK);
  fill(g,x=>{x.moveTo(-.05,.13);x.lineTo(.05,.13);x.lineTo(0,.19);x.closePath()},'#ff7aa8');
  line(g,INK,.035,x=>{x.moveTo(-.13,.21);x.quadraticCurveTo(-.06,.3,0,.19);x.quadraticCurveTo(.06,.3,.13,.21)});
  line(g,INK,.022,x=>{for(const s of[-1,1]){x.moveTo(s*.32,.09);x.lineTo(s*.64,.02);x.moveTo(s*.32,.16);x.lineTo(s*.64,.2)}});
};
HEADS.dog=function(g,c,b){
  const ear=s=>x=>{x.moveTo(s*.34,-.3);x.quadraticCurveTo(s*.78,-.24,s*.72,.26);x.quadraticCurveTo(s*.62,.48,s*.46,.22);x.quadraticCurveTo(s*.42,-.05,s*.3,-.1);x.closePath()};
  cut(g,ear(-1),'#6b3f2a');cut(g,ear(1),'#6b3f2a');
  cut(g,ell(0,0,.47,.44),c);
  if(b)return;
  fill(g,ell(.2,-.1,.19,.19),'rgba(255,255,255,.38)');
  eyes(g,.19,-.1,.11);
  fill(g,ell(0,.21,.26,.18),'#fff6d8');
  fill(g,ell(0,.11,.1,.07),INK);
  line(g,INK,.035,x=>{x.moveTo(0,.18);x.lineTo(0,.25);x.moveTo(-.13,.26);x.quadraticCurveTo(-.06,.33,0,.25);x.quadraticCurveTo(.06,.33,.13,.26)});
  fill(g,rr(-.06,.29,.12,.16,.06),'#ff7aa8');
};
HATS.flowers=function(g){
  const c=['#ff5fa8','#ffd23f','#35c8ff','#fffdf6','#b983ff'];
  for(let i=0;i<5;i++){const x=-.36+i*.18,y=.02-Math.sin((i+.5)/5*PI)*.13;cut(g,circ(x,y,.1),c[i],.05);fill(g,circ(x,y,.04),'#ff7a2f')}
};
HATS.bow=function(g){

  if(!reduce)for(let i=0;i<9;i++)fireworks.push({x:.08+Math.random()*.84,y:.14+Math.random()*.22,at:t+i*.2,c:CF[i%CF.length],s:Math.random()*TAU});
  crowd.forEach((a,i)=>{a.em='jump';a.emEnd=t+2.2+Math.random()*1.2;if(i<130)addFloat(a.x,a.z,EMO[i%EMO.length],false)});
}
function chatTick(dt,t){
  const n=crowd.length,spam=S.spam&&t<S.spam.until;
  S.msgDebt+=n*(.35*Math.pow(S.chat,1.5)+(spam?.75:0))*dt;
  while(S.msgDebt>=1){
    S.msgDebt--;
    const a=crowd[Math.floor(Math.random()*n)];if(a.me)continue;
    const em=spam&&Math.random()<.85?S.spam.em:(Math.random()<.62?EMO[Math.floor(Math.random()*6)]:null);
    chatMsg(a,em);
    if(em&&!C.back&&Math.random()<.35){const sp=SEA[Math.floor(Math.random()*SEA.length)];if(sp[1]>S.maxZ+2)addFloat(sp[0],sp[1],em,true)}
  }
  S.heat*=Math.exp(-dt/6);
  S.chatE+=(clamp(S.heat/(n*1.6),0,1)-S.chatE)*Math.min(1,dt*1.5);
  for(const k in S.counts){S.counts[k]*=Math.exp(-dt/2);if(S.counts[k]>n*.32&&t-S.waveAt>7)S.waveAt=t}
  if(t-S.hypeAt<8)S.meter*=Math.exp(-dt*.9);
  else{S.meter=clamp(S.meter+dt*(Math.pow(S.chatE,2.5)*.32-.03),0,1);if(S.meter>=1&&!S.lights)hypeBurst(t)}
  S.mShow+=(S.meter-S.mShow)*Math.min(1,dt*7);
}
function drawFloats(t){
  const k=H/1080;
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i],age=t-f.at;
    if(age>f.life){floats.splice(i,1);continue}
    const q=age/f.life,p=proj(f.x+Math.sin(age*3+f.dx)*.3,2.55+q*(f.sea?3.2:4.2),f.z);
    if(!p||p[0]<-100||p[0]>W+100)continue;
    const pop=Math.min(1,age*7)*(1+.25*Math.sin(Math.min(1,age*4.5)*PI)),sz=clamp(p[2]*.95,f.sea?9*k:24*k,165*k)*pop;
    ctx.globalAlpha=q>.72?(1-q)/.28:1;
    ctx.drawImage(EMO_SPR[f.em],p[0]-sz/2,p[1]-sz/2,sz,sz);
  }
  ctx.globalAlpha=1;
}
function hypeMeter(t){
  const k=H/1080,w=W*.36,h=48*k,v=S.mShow,lit=t-S.hypeAt<3;
  const sh=v>.82&&!reduce?Math.sin(t*38)*4*k*(v-.82)/.18:0;
  const x=(W-w)/2+sh,y=30*k,pad=7*k;
  ctx.fillStyle=PAPER;ctx.fillRect(x-pad,y-pad,w+pad*2,h+pad*2);
  ctx.fillStyle='#1c1266';ctx.fillRect(x,y,w,h);
  const gr=ctx.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#19d3c5');gr.addColorStop(.55,'#ffc21a');gr.addColorStop(1,'#ff3d81');
  ctx.fillStyle=gr;ctx.fillRect(x,y,w*v,h);
  ctx.fillStyle='rgba(28,18,102,.55)';for(let i=1;i<12;i++)ctx.fillRect(x+w*i/12-k,y,2*k,h);
  ctx.font='400 '+(29*k)+'px "Bowlby One","Arial Black",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const txt=S.lights&&v>.99?'READY WHEN THE LIGHTS COME UP':'HYPE';
  ctx.fillStyle=INK;ctx.fillText(txt,x+w/2+2*k,y+h/2+3*k);ctx.fillStyle=PAPER;ctx.fillText(txt,x+w/2,y+h/2+1*k);
  if(lit){
    const age=t-S.hypeAt,sc=Math.min(1,age*6)*(1+.14*Math.sin(Math.min(1,age*4)*PI));
    ctx.save();ctx.translate(W/2,H*.3);ctx.rotate(-.045);ctx.scale(sc,sc);ctx.globalAlpha=age>2.5?(3-age)/.5:1;
    const fs=92*k;ctx.font='400 '+fs+'px "Bowlby One","Arial Black",sans-serif';
    const lbl='CHAT EARNED THIS',tw=ctx.measureText(lbl).width+fs*1.1,th=fs*1.75;
    ctx.fillStyle='#ff3d81';ctx.fillRect(-tw/2+12*k,-th/2+12*k,tw,th);ctx.fillStyle=PAPER;ctx.fillRect(-tw/2,-th/2,tw,th);
    ctx.fillStyle=INK;ctx.fillText(lbl,0,fs*.05);ctx.restore();ctx.globalAlpha=1;
  }
}

/* ---------- frame ---------- */
const confetti=[];
function spawnConfetti(n){for(let i=0;i<n&&confetti.length<420;i++)confetti.push({x:(Math.random()-.5)*28,y:6+Math.random()*9,z:Math.random()*24,v:1.6+Math.random()*1.6,ph:Math.random()*TAU,c:CF[i%CF.length],sz:.14+Math.random()*.14})}
let debt=0,last=performance.now()/1000,fpsE=60,fpsAt=0;
S.t0=last;S.t=0;
const vis=[];const glows=[];
function frame(){
  requestAnimationFrame(frame);
  const nowS=performance.now()/1000,dt=Math.min(.1,nowS-last);last=nowS;S.t+=dt;
  const t=S.t,beat=(nowS-S.t0)*S.bpm/60,bar=Math.floor(beat/4);S.beat=beat;
  fpsE+=(1/Math.max(dt,.001)-fpsE)*.06;
  if(nowS-fpsAt>.5){fpsAt=nowS;document.getElementById('fps').textContent=Math.round(fpsE)}
  audioStep();
  S.boost*=Math.exp(-dt/5);
  chatTick(dt,t);
  S.E=clamp(Math.max(.22,.55*S.energy+.6*S.chatE)+S.boost*.7,0,1.3);
  S.dim+=((S.lights?.86:0)-S.dim)*Math.min(1,dt*1.6);
  S.flash*=Math.exp(-dt*5);S.shake*=Math.exp(-dt*3.2);
  debt+=crowd.length*.032*(.3+S.E)*(S.lights?.25:1)*dt;
  while(debt>=1){debt--;const a=crowd[Math.floor(Math.random()*crowd.length)];if(a.me)continue;emote(a,pick(['clap','clap','phone','lighter','jump','dance','dance','flag']))}
  S.pyro*=Math.exp(-dt*2.2);
  S.co2=Math.max(S.co2*Math.exp(-dt*1.4),S.pyro*.9);
  if(!reduce&&S.E>.62&&Math.floor(beat)%32===0&&((beat%1)+1)%1<dt*S.bpm/60)S.co2=1;
  if(!reduce&&S.E>.8&&Math.floor(beat)%16===0&&((beat%1)+1)%1<dt*S.bpm/60)S.pyro=Math.max(S.pyro,.7);
  if(S.auto&&bar>=S.nextCut)autoCut(bar);

  const st=reduce?0:t;
  const sh=SHOTS[S.shot](st);
  const push=1+Math.min(t-S.cutAt,12)*(reduce?0:.012);
  sh.p[0]+=S.mx*(sh.p[2]<sh.l[2]?1:-1);sh.l[0]+=S.mx*(sh.p[2]<sh.l[2]?1:-1);
  sh.p[1]=Math.max(.8,sh.p[1]+S.my);sh.l[1]+=S.my;
  if(S.shake>.01&&!reduce){sh.l[0]+=(Math.random()-.5)*S.shake*.9;sh.l[1]+=(Math.random()-.5)*S.shake*.9}
  setCam(sh.p,sh.l,sh.f*S.zoom*push);

  ctx.setTransform(1,0,0,1,0,0);
  scenery(beat,t);

  vis.length=0;
  let tgtD=0;
  if(S.shot==='close'&&S.target){const q=tf(S.target.x,0,S.target.z);tgtD=q[2]-.7}
  for(const a of crowd){
    const q=tf(a.x,0,a.z);if(q[2]<.9||q[2]<tgtD&&a!==S.target)continue;
    const s=F/q[2],x=W/2+q[0]*s;if(x<-3*s||x>W+3*s)continue;
    a._s=s;a._x=x;a._y=H/2-q[1]*s;a._d=q[2];vis.push(a);
  }
  vis.sort((a,b)=>b._d-a._d);
  glows.length=0;
  for(const a of vis)drawAvatar(ctx,a,a._x,a._y,a._s,t,beat,C.back,a._s>135,glows);
  lightShow(beat,t);

  if(S.dim>.01){
    const k=S.dim,r=255-(255-30)*k|0,g=255-(255-26)*k|0,b=255-(255-92)*k|0;
    ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgb('+r+','+g+','+b+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(.6,k*.75);
    if(!C.back)for(const sp of SEA){
      if(sp[1]<S.maxZ+2)continue;
      const p=proj(sp[0],2.6,sp[1]);if(!p||p[0]<0||p[0]>W)continue;
      const r=Math.max(3,Math.min(p[2]*.55,H*.02))*(.75+.25*Math.sin(t*3+sp[2]));
      ctx.drawImage(sp[3]?GLOW.fire:GLOW.cool,p[0]-r,p[1]-r,r*2,r*2);
    }
    for(let i=0;i<glows.length;i+=4){const sp=glows[i],r2=glows[i+3];ctx.drawImage(sp,glows[i+1]-r2,glows[i+2]-r2,r2*2,r2*2)}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }

  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i];c.y-=c.v*dt;c.ph+=dt*7;c.x+=Math.sin(c.ph*.5)*dt*.8;
    if(c.y<.05){confetti.splice(i,1);continue}
    const p=proj(c.x,c.y,c.z);if(!p)continue;
    const w=c.sz*p[2]*Math.abs(Math.cos(c.ph)),h=c.sz*p[2]*.62;
    ctx.fillStyle=c.c;ctx.fillRect(p[0]-w/2,p[1]-h/2,Math.max(w,1),h);
  }
  for(let i=fireworks.length-1;i>=0;i--){
    const f=fireworks[i],age=t-f.at;if(age<0)continue;
    if(age>1.5){fireworks.splice(i,1);continue}
    const k=H/1080,r=(1-Math.pow(1-age/1.5,3))*230*k,sz=13*k*(1-age/1.5)+2;
    ctx.fillStyle=f.c;
    for(let j=0;j<26;j++){const q=j/26*TAU+f.s;ctx.fillRect(f.x*W+Math.cos(q)*r-sz/2,f.y*H+Math.sin(q)*r+age*age*45*k-sz/2,sz,sz)}
  }
  drawFloats(t);
  labels(t);
  streamTags();
  hypeMeter(t);
  if(S.flash>.01&&!reduce){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,'+(S.flash*.55)+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
  drawPreview(t,beat);
}
const placed=[];
function labels(t){
  const k=H/1080;placed.length=0;
  const cand=[];
  for(const a of vis){
    if(a.me){cand.push([a,1e9]);continue}
    const rec=t-a.lastEmote;
    if(rec<2.4||a._s>210)cand.push([a,-rec+(a===S.target&&S.shot==='close'?100:0)]);
  }
  cand.sort((x,y)=>y[1]-x[1]);
  ctx.textAlign='center';ctx.textBaseline='middle';
  let n=0;
  for(const[a]of cand){
    if(n>=16)break;
    pose(a,t,S.beat);
    const fs=clamp(a._s*.2,19*k,36*k),y=a._y-P.hop*a._s-(P.em==='flag'?3.95:P.em==='pump'||!P.em?2.3:2.95)*a._s;
    if(y<fs)continue;
    ctx.font='800 '+fs+'px Figtree,system-ui,sans-serif';
    const w=ctx.measureText(a.name).width+fs*1.1,h=fs*1.65,x=a._x-w/2,top=y-h/2;
    if(x<0||x+w>W)continue;
    if(!a.me&&placed.some(r=>x<r[0]+r[2]&&x+w>r[0]&&top<r[1]+r[3]&&top+h>r[1]))continue;
    placed.push([x,top,w,h]);n++;
    const a2=S.dim>.5?.92:1;ctx.globalAlpha=a2;
    ctx.fillStyle=a.me?'#ffc21a':PAPER;ctx.beginPath();ctx.roundRect(x,top,w,h,h*.22);ctx.fill();
    ctx.fillStyle=a.me?INK:a.nc;ctx.fillText(a.name,a._x,y+fs*.04);ctx.globalAlpha=1;
  }
}
function streamTags(){
  const k=H/1080,m=26*k;
  ctx.textBaseline='middle';ctx.textAlign='left';
  const tag=(text,x,y,bg,fg,fs)=>{ctx.font='400 '+fs+'px "Bowlby One","Arial Black",sans-serif';const w=ctx.measureText(text).width+fs*1.2,h=fs*1.8;const X=x<0?W+x-w:x;ctx.fillStyle=bg;ctx.fillRect(X,y,w,h);ctx.fillStyle=fg;ctx.fillText(text,X+fs*.6,y+h/2+fs*.03)};
  tag(crowd.length+' BIBOS IN THE CROWD',m,m,PAPER,INK,28*k);
  tag('TYPE !BIBO TO GET IN',-m,H-m-28*k*1.8,'#ff3d81',PAPER,28*k);
}

function drawPreview(t,beat){
  const w=pv.width,h=pv.height;pg.setTransform(1,0,0,1,0,0);pg.clearRect(0,0,w,h);
  const s=h*.3;
  drawAvatar(pg,draft,w/2,h*.93,s,t,beat,false,true,null);

    const f=pvFloats[i],q=(t-f.at)/1.6;if(q>1){pvFloats.splice(i,1);continue}
    const sz=h*.24*Math.min(1,q*9);pg.globalAlpha=q>.7?(1-q)/.3:1;
    pg.drawImage(EMO_SPR[f.em],f.x*w-sz/2,h*.34-q*h*.32-sz/2,sz,sz);pg.globalAlpha=1;
  }
}

function emoButtons(box,verb,fn){EMO.forEach(e=>{const b=document.createElement('button');b.className='pick';b.setAttribute('aria-label',verb+' '+e);const c=document.createElement('canvas');c.width=c.height=96;c.getContext('2d').drawImage(EMO_SPR[e],4,4,88,88);b.appendChild(c);b.addEventListener('click',()=>fn(e));box.appendChild(b)})}
emoButtons($('spam'),'Spam',e=>{S.spam={em:e,until:S.t+3.5}});
emoButtons($('float'),'Send',e=>{pvFloats.push({em:e,at:S.t,x:.3+Math.random()*.4});if(joined)chatMsg(draft,e)});
$('chat').addEventListener('input',e=>{S.chat=e.target.value/100;$('chatO').textContent=e.target.value+'%'});
$('fill').addEventListener('click',()=>{S.hypeAt=-99;S.meter=1});

requestAnimationFrame(frame);
})();
</script>
