<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#120a3d">
  <title>Bibos Light Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@600;800&display=swap">
  <link rel="stylesheet" href="./src/panel.css">
</head>
<body>
  <main id="login" class="login">
    <h1>BIBOS <span>LIGHT DESK</span></h1>
    <form id="loginForm">
      <label>Channel <input id="room" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>Password <input id="password" type="password" autocomplete="current-password"></label>
      <label class="check"><input id="remember" type="checkbox" checked> Remember on this device</label>
      <button type="submit" class="big go">Unlock</button>
      <p id="loginMsg" class="msg" role="status"></p>
    </form>
  </main>

  <main id="desk" class="desk" hidden>
    <header>
      <h1>BIBOS <span>LIGHT DESK</span></h1>
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">Connecting…</span></div>
      <button id="logout" class="ghost">Lock</button>
    </header>

    <section class="panel">
      <h2>Show</h2>
      <div class="grid g3">
        <button class="big hot" data-cmd="drop">💥 Drop</button>
        <button class="big" data-cmd="hype">🔥 Hype finale</button>
        <button class="big toggle" data-cmd="lights" data-state="lights">🌙 Lights down</button>
      </div>
      <div class="grid g2">
        <button data-cmd="help" id="helpShow">📋 Show commands card</button>
        <button data-cmd="help" data-arg="off">Hide card</button>
      </div>
      <div class="grid g5">
        <span class="label">Auto-show card:</span>
        <div class="grid g4 span4" data-group="helpEvery">
          <button data-cmd="helpevery" data-arg="0">Never</button>
          <button data-cmd="helpevery" data-arg="5">5 min</button>
          <button data-cmd="helpevery" data-arg="10">10 min</button>
          <button data-cmd="helpevery" data-arg="15">15 min</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Looks</h2>
      <div class="grid g6" data-group="look">
        <button data-cmd="look" data-arg="auto">Auto</button>
        <button data-cmd="look" data-arg="fan">Fan</button>
        <button data-cmd="look" data-arg="cross">Cross</button>
        <button data-cmd="look" data-arg="chase">Chase</button>
        <button data-cmd="look" data-arg="wave">Wave</button>
        <button data-cmd="look" data-arg="pulse">Pulse</button>
      </div>
    </section>

    <section class="panel">
      <h2>Colors</h2>
      <div id="swatches" class="grid g5"></div>
      <div class="row custom">
        <span>Custom</span>
        <input id="colA" type="color" value="#ff3d81" aria-label="First color">
        <input id="colB" type="color" value="#19d3c5" aria-label="Second color">
        <button id="sendColors">Use</button>
      </div>
    </section>

    <section class="panel">
      <h2>Rig</h2>
      <label class="slider">Intensity <output id="intOut">100%</output>
        <input id="intensity" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label class="slider">Movement speed <output id="spdOut">1.0×</output>
        <input id="speed" type="range" min="0.1" max="4" step="0.05" value="1"></label>
      <div class="grid g3" data-group="lasers">
        <button data-cmd="lasers" data-arg="auto">Lasers auto</button>
        <button data-cmd="lasers" data-arg="on">Lasers on</button>
        <button data-cmd="lasers" data-arg="off">Lasers off</button>
      </div>
      <div class="grid g3">
        <button class="toggle" data-cmd="strobe" data-state="strobe">Beat strobe</button>
        <button class="toggle" data-cmd="blackout" data-state="blackout">Blackout</button>
        <button data-cmd="reset">Reset rig</button>
      </div>
    </section>

    <section class="panel">
      <h2>Pyro</h2>
      <div class="grid g3">
        <button class="fire" data-cmd="fire">Flames</button>
        <button class="fire" data-cmd="fire" data-arg="chase">Flame chase</button>
        <button class="ice" data-cmd="co2">CO2</button>
        <button class="gold" data-cmd="sparks">Sparks</button>
        <button class="gold" data-cmd="falls">Waterfall</button>
        <button class="sky" data-cmd="fireworks" data-arg="8">Fireworks</button>
      </div>
      <button class="big hot wide" data-cmd="pyro">Everything</button>
    </section>

    <section class="panel">
      <h2>Camera</h2>
      <div class="grid g6" data-group="shot">
        <button data-cmd="cam" data-arg="auto">Auto</button>
        <button data-cmd="cam" data-arg="wide">Wide</button>
        <button data-cmd="cam" data-arg="sweep">Sweep</button>
        <button data-cmd="cam" data-arg="over">Over</button>
        <button data-cmd="cam" data-arg="close">Close-up</button>
        <button data-cmd="cam" data-arg="back">Stage</button>
      </div>
      <div class="grid g5">
        <button data-cmd="cut" class="hot">Next shot</button>
        <span class="label">Auto cuts:</span>
        <div class="grid g3 span3" data-group="pace">
          <button data-cmd="pace" data-arg="slow">Slow</button>
          <button data-cmd="pace" data-arg="normal">Normal</button>
          <button data-cmd="pace" data-arg="fast">Fast</button>
        </div>
      </div>
      <label class="slider">Zoom <output id="zoomOut">1.0×</output>
        <input id="zoom" type="range" min="0.7" max="2.4" step="0.05" value="1"></label>
      <label class="slider">Pan left / right <output id="panOut">0</output>
        <input id="pan" type="range" min="-13" max="13" step="0.5" value="0"></label>
      <label class="slider">Height <output id="heightOut">0</output>
        <input id="height" type="range" min="-3" max="5" step="0.25" value="0"></label>
      <div class="grid g2">
        <button data-cmd="frame">Reset framing</button>
        <button data-cmd="shake">Camera shake</button>
      </div>
      <form id="focusForm" class="row custom">
        <input id="focusName" placeholder="Viewer name" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Viewer to close up on">
        <button type="submit">Close-up on viewer</button>
      </form>
    </section>

    <section class="panel">
      <h2>Side screens</h2>
      <div class="grid g4" data-group="screens">
        <button data-cmd="screens" data-arg="auto">Auto</button>
        <button data-cmd="screens" data-arg="meter">Meter</button>
        <button data-cmd="screens" data-arg="stripes">Stripes</button>
        <button data-cmd="screens" data-arg="checker">Checker</button>
        <button data-cmd="screens" data-arg="ripple">Ripple</button>
        <button data-cmd="screens" data-arg="solid">Solid</button>
        <button data-cmd="screens" data-arg="off">Off</button>
        <button data-cmd="screens" data-arg="text" id="textMode" disabled>Text</button>
      </div>
      <div class="grid g4 pics" data-group="screens">
        <button data-cmd="screens" data-arg="heart"><span class="pix" data-img="heart"></span>Heart</button>
        <button data-cmd="screens" data-arg="star"><span class="pix" data-img="star"></span>Star</button>
        <button data-cmd="screens" data-arg="smile"><span class="pix" data-img="smile"></span>Smile</button>
        <button data-cmd="screens" data-arg="note"><span class="pix" data-img="note"></span>Music</button>
        <button data-cmd="screens" data-arg="bolt"><span class="pix" data-img="bolt"></span>Bolt</button>
        <button data-cmd="screens" data-arg="fire"><span class="pix" data-img="fire"></span>Fire</button>
        <button data-cmd="screens" data-arg="arrow"><span class="pix" data-img="arrow"></span>Arrow</button>
        <button data-cmd="screens" data-arg="diamond"><span class="pix" data-img="diamond"></span>Diamond</button>
      </div>
      <form id="textForm" class="row custom">
        <input id="screenText" maxlength="40" placeholder="Scrolling text, e.g. DROP INCOMING" autocomplete="off" aria-label="Scrolling text">
        <button type="submit">Scroll it</button>
      </form>
      <p class="hint">Letters, numbers and ! ? - . : ' + work. Type &lt; for a heart.</p>
    </section>

    <section class="panel">
      <h2>Tempo</h2>
      <div class="tempo">
        <div class="bpm"><output id="bpm">128</output><small>BPM</small></div>
        <button id="tap" class="big">Tap</button>
        <button data-cmd="beat" class="big">Sync on 1</button>
      </div>
      <div class="grid g4">
        <button data-cmd="nudge" data-arg="-50">◀ 50ms</button>
        <button data-cmd="nudge" data-arg="-10">◀ 10ms</button>
        <button data-cmd="nudge" data-arg="10">10ms ▶</button>
        <button data-cmd="nudge" data-arg="50">50ms ▶</button>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
